name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend requirements
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run Ruff
        run: ruff check .

  tests-postgres:
    name: Storage and DB wrapper tests (PostgreSQL)
    runs-on: ubuntu-latest
    # ws-i makes this required.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dmef
          POSTGRES_PASSWORD: dmef
          POSTGRES_DB: dmef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmef -d dmef"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dmef:dmef@localhost:5432/dmef

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend requirements
        run: python -m pip install -r requirements.txt

      - name: Run Postgres-scoped tests
        run: python -m pytest -q tests/test_db_wrapper.py tests/test_storage.py tests/test_database.py
