name: Quality

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Backend and frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend requirements
        run: python -m pip install -r requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend requirements
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        run: python -m pytest -q

      - name: Compile backend modules
        run: python -m compileall -q main.py database routes services tests

      - name: Run targeted Ruff checks
        # These are the documented maintained-module checks. Repository-wide
        # Ruff checks are intentionally not claimed green here.
        run: >-
          ruff check routes/review.py services/paths.py services/review
          tests/test_paths.py tests/test_compatibility_facades.py
          tests/test_review_boundary.py tests/test_low_memory.py

      - name: Check targeted Ruff formatting
        run: >-
          ruff format --check routes/review.py services/paths.py services/review
          tests/test_paths.py tests/test_compatibility_facades.py
          tests/test_review_boundary.py tests/test_low_memory.py

      - name: Run targeted mypy checks
        # This follows the documented scope; it does not assert repository-wide
        # mypy success.
        run: mypy services/paths.py services/review

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Check frontend types
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check
