# Cloud Scheduler retention job (ws-j-deploy-smoke; scheduler auth fx-hygiene).
# Daily 02:00 IST -> POST /admin/retention/run?dry_run=false.
#
# AUTH: the endpoint accepts an admin JWT *or* the scheduler bearer
# `Authorization: Bearer <DMEF_SCHEDULER_TOKEN>` (see routes/admin_ops.py
# `_admin_or_scheduler`; token read via services.config.get_setting).
# Cloud Scheduler OIDC alone is NOT a DMEF admin JWT, so a job that sends
# only the OIDC token gets 401. Always send the bearer header below IN
# ADDITION to OIDC: OIDC gets the request through Cloud Run IAM
# (run.routes.invoke), the bearer header authenticates it to DMEF.
# The endpoint stays authenticated; never remove the bearer requirement.
# Create once (operator only; substitute the real token, never commit it):
#   gcloud scheduler jobs create http dmef-retention-daily \
#     --location=asia-south1 \
#     --schedule="0 2 * * *" \
#     --time-zone="Asia/Kolkata" \
#     --uri="https://dmef-api-PROJECT_HASH-REGION.a.run.app/admin/retention/run?dry_run=false" \
#     --http-method=POST \
#     --oidc-service-account-email=dmef-scheduler@PROJECT_ID.iam.gserviceaccount.com \
#     --oidc-token-audience="https://dmef-api-PROJECT_HASH-REGION.a.run.app" \
#     --headers="Content-Type=application/json,Authorization=Bearer DMEF_SCHEDULER_TOKEN_VALUE" \
#     --message-body="{}"
apiVersion: cloudscheduler.googleapis.com/v1
kind: Job
metadata:
  name: dmef-retention-daily
labels:
  app: dmef
  component: retention
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Kolkata
  httpTarget:
    httpMethod: POST
    uri: https://dmef-api-PROJECT_HASH-REGION.a.run.app/admin/retention/run?dry_run=false
    headers:
      Content-Type: application/json
      # DMEF auth: bearer for POST /admin/retention/run, sent IN ADDITION to
      # OIDC. OIDC alone is not a DMEF admin JWT -> the endpoint 401s.
      # The operator substitutes the real DMEF_SCHEDULER_TOKEN value here
      # (placeholder only; never commit a real secret).
      Authorization: Bearer DMEF_SCHEDULER_TOKEN_VALUE
    body: "{}"
    oidcToken:
      serviceAccountEmail: dmef-scheduler@PROJECT_ID.iam.gserviceaccount.com
      audience: https://dmef-api-PROJECT_HASH-REGION.a.run.app
  retryConfig:
    retryCount: 3
    maxRetryDuration: 600s
    minBackoffDuration: 60s
    maxBackoffDuration: 600s
